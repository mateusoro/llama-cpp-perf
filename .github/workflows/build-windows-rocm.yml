name: Build Windows ROCm HIP

# Build do llama.cpp (upstream thecodacus/llama.cpp, branch perf) com backend ROCm/HIP.
# Layout novo do ROCm para Windows (TheRock wheels + rocm-sdk), inspirado no job `hip`
# do build-cuda-windows.yml / release.yml do llama.cpp, com nossas melhorias:
#   - concurrency: apenas 1 build por vez (novo cancela o antigo)
#   - release automática a cada build (tag build-<run_number>, nunca sobrescreve)
#   - inputs de gfx targets e da versão do ROCm
#   - ccache para acelerar builds repetidos
#   - bundle das DLLs de runtime (amdhip64_7.dll etc.) para o binário rodar direto

on:
  push:
    branches: [perf]
  workflow_dispatch:
    inputs:
      gfx_targets:
        description: 'GPU targets (separados por ; )'
        required: false
        default: 'gfx1101'
      rocm_version:
        description: 'ROCm wheel version (rocm[libraries,devel]==VERSION). Disponivel no indice: 10.0.0'
        required: false
        default: '10.0.0'

env:
  GH_TOKEN: ${{ github.token }}
  GFX_TARGETS: ${{ github.event.inputs.gfx_targets || 'gfx1101' }}
  UPSTREAM_REPO: 'https://github.com/thecodacus/llama.cpp.git'
  # Make sure this is in sync with build-cache.yml
  ROCM_VERSION: ${{ github.event.inputs.rocm_version || '10.0.0' }}
  # Nova release a cada execução: run_number é único por execução do workflow.
  RELEASE_TAG: 'build-${{ github.run_number }}'

# Garante que apenas UM build rode por vez (o mais novo cancela os antigos).
concurrency:
  group: llama-cpp-build
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6

      - name: Clone upstream
        shell: pwsh
        run: |
          Write-Host "=== Clonando upstream ===" -ForegroundColor Cyan
          git clone --depth 1 --branch perf ${{ env.UPSTREAM_REPO }} upstream-temp

          # Copiar upstream para cima do fork (preserva .github/ nosso)
          $items = Get-ChildItem upstream-temp -Force
          foreach ($item in $items) {
              if ($item.Name -eq ".git") { continue }
              $dest = Join-Path "${{ github.workspace }}" $item.Name
              if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
              Copy-Item $item.FullName $dest -Recurse -Force
          }
          Remove-Item upstream-temp -Recurse -Force
          Write-Host "=== Pronto ===" -ForegroundColor Cyan

      - name: Install Ninja
        run: choco install ninja -y

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.24
        with:
          key: llama-windows-hip-${{ env.ROCM_VERSION }}-${{ env.GFX_TARGETS }}
          evict-old-files: 1d
          max-size: "1G"

      - name: Setup ROCm
        uses: ./.github/actions/windows-setup-rocm
        with:
          version: ${{ env.ROCM_VERSION }}

      - name: Setup ROCm Environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Activate venv from install
          & C:\TheRock\build\.venv\Scripts\Activate.ps1

          # Expand the devel tree (idempotent; no-op if already done during install)
          rocm-sdk init
          if ($LASTEXITCODE -ne 0) { throw "rocm-sdk init failed with exit code $LASTEXITCODE" }

          # Get ROCm installation paths using the rocm-sdk CLI tool
          $rocmPath = (rocm-sdk path --root)
          if (-not $rocmPath) { throw "rocm-sdk path --root returned empty - devel package may not be installed" }
          $rocmPath = $rocmPath.Trim()
          $cmakePath = (rocm-sdk path --cmake).Trim()
          $binPath = (rocm-sdk path --bin).Trim()
          write-host "ROCm root: $rocmPath"
          write-host "CMake path: $cmakePath"
          write-host "Bin path: $binPath"

          echo "HIP_PATH=$rocmPath" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$cmakePath" >> $env:GITHUB_ENV
          echo "HIP_DEVICE_LIB_PATH=$rocmPath\lib\llvm\amdgcn\bitcode" >> $env:GITHUB_ENV
          echo "HIP_PLATFORM=amd" >> $env:GITHUB_ENV
          echo "LLVM_PATH=$rocmPath\lib\llvm" >> $env:GITHUB_ENV
          echo "$binPath" >> $env:GITHUB_PATH

          # Keep venv in PATH for subsequent steps
          echo "C:\TheRock\build\.venv\Scripts" >> $env:GITHUB_PATH

      - name: Verify ROCm
        shell: pwsh
        run: |
          # Test the ROCm clang shipped in the installed wheel
          & "${env:HIP_PATH}\lib\llvm\bin\clang.exe" --version

      - name: Build
        shell: pwsh
        run: |
          Write-Host "HIP Path: $env:HIP_PATH" -ForegroundColor Cyan
          Write-Host "Targets: ${{ env.GFX_TARGETS }}" -ForegroundColor Cyan

          cmake -G "Ninja" -B build -S . `
            -DCMAKE_PREFIX_PATH="${env:HIP_PATH}" `
            -DCMAKE_C_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_CXX_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang++.exe" `
            -DCMAKE_HIP_COMPILER="${env:HIP_PATH}\lib\llvm\bin\clang.exe" `
            -DCMAKE_BUILD_TYPE=Release `
            -DLLAMA_BUILD_BORINGSSL=ON `
            -DHIP_PATH="${env:HIP_PATH}" `
            -DGGML_HIP=ON `
            -DGGML_HIP_FORCE_MMQ=ON `
            # Sem isto o cmake liga GGML_NATIVE (default ON quando nao ha cross-compile)
            # e compila com -march=native no runner do GitHub (Xeon com AVX-512),
            # gerando ggml-cpu com instrucoes EVEX/zmm que causam SIGILL
            # ("Illegal instruction") no Ryzen 7 5800X (Zen 3, sem AVX-512).
            # Com BACKEND_DL+ALL_VARIANTS o ggml-cpu vira varias DLLs e o loader
            # escolhe a melhor para a CPU local em runtime (ex.: haswell no Zen 3).
            -DGGML_NATIVE=OFF `
            -DGGML_CPU_ALL_VARIANTS=ON `
            -DGGML_BACKEND_DL=ON `
            -DGGML_VULKAN=OFF `
            -DGGML_CUDA=OFF `
            -DGGML_RPC=OFF `
            -DAMDGPU_TARGETS="${{ env.GFX_TARGETS }}" `
            -DGPU_TARGETS="${{ env.GFX_TARGETS }}" `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_BUILD_UI=OFF `
            -DLLAMA_BUILD_TESTS=OFF

          cmake --build build -j ${env:NUMBER_OF_PROCESSORS}
          Write-Host "Build OK" -ForegroundColor Green

      - name: Verify HIP backend was built
        shell: pwsh
        run: |
          $hipDll = Get-ChildItem -Path build\bin -Filter "ggml-hip*.dll" -ErrorAction SilentlyContinue
          if (-not $hipDll) {
            Write-Host "##[error]ggml-hip*.dll was NOT produced. The HIP backend silently failed to build."
            Get-ChildItem build\bin | Format-Table -AutoSize
            exit 1
          }
          Write-Host "HIP backend artifact found:"
          $hipDll | Format-Table FullName, Length -AutoSize

          # Guarda contra a regressao do -march=native: sem CPU_ALL_VARIANTS a
          # build gera um unico ggml-cpu.dll compilado para a CPU do runner
          # (AVX-512) e o binario quebra com SIGILL em CPUs sem AVX-512.
          $cpuVariants = Get-ChildItem -Path build\bin -Filter "ggml-cpu-*.dll" -ErrorAction SilentlyContinue
          if (-not $cpuVariants) {
            Write-Host "##[error]no ggml-cpu-*.dll variants were produced. GGML_CPU_ALL_VARIANTS/GGML_BACKEND_DL did not take effect."
            Get-ChildItem build\bin | Format-Table -AutoSize
            exit 1
          }
          Write-Host "CPU backend variants found:"
          $cpuVariants.Name -join ", "

      - name: Bundle HIP runtime DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # ggml-hip.dll loads amdhip64_7.dll at run time; the Adrenalin driver
          # ships one in System32 which the loader finds first. Copy the matching
          # runtime next to the binaries so the right version is used.
          # rocm_kpack.dll is amdhip64_7's direct dependency (it carries the GPU
          # kernels in ROCm 10 - there is no rocblas/library any more).
          # amd_comgr is copied as well to keep it in sync with the bundled
          # amdhip64, avoiding a version mismatch with a amd_comgr from System32.
          # hipblas/rocblas/rocsolver are imported by ggml-hip.dll too (BLAS) and
          # are NOT optional: without hipblas.dll ggml-hip.dll fails to load and
          # the resulting package dies with 0xC0000135. libhipblaslt/origami are
          # rocblas.dll's own dependencies. None of these DLLs live in System32
          # or ship with the Adrenalin driver, so they must be bundled.
          $binPath = (rocm-sdk path --bin).Trim()
          if (-not $binPath) { throw "rocm-sdk path --bin returned empty" }
          write-host "ROCm bin path: $binPath"

          $patterns = @(
            "amdhip64_7.dll",
            "rocm_kpack.dll",
            "amd_comgr.dll",
            "hipblas.dll",
            "rocblas.dll",
            "rocsolver.dll",
            "libhipblaslt.dll",
            "origami.dll"
          )
          foreach ($pattern in $patterns) {
            $files = Get-ChildItem -Path $binPath -Filter $pattern -ErrorAction SilentlyContinue
            if (-not $files) { throw "no match for $pattern in $binPath" }
            foreach ($f in $files) {
              Copy-Item $f.FullName -Destination build\bin -Force
              write-host "  copied $($f.Name)"
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $archive = "llama-windows-x64-${{ env.GFX_TARGETS }}.zip"
          $archive = $archive.Replace(';', '_')
          Compress-Archive -Path "build\bin\*.exe", "build\bin\*.dll" -DestinationPath $archive
          Write-Host "Archive: $archive" -ForegroundColor Green

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-Windows-${{ env.ROCM_VERSION }}-${{ env.GFX_TARGETS }}
          path: llama-windows-*.zip
          retention-days: 90

      - name: Create/Update Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Build Windows ROCm ${{ env.ROCM_VERSION }} (${{ env.GFX_TARGETS }}) #${{ github.run_number }}"
          body: |
            Build automático do llama.cpp (ROCmFPX perf) para Windows com ROCm/HIP.

            **GPU Targets:** ${{ env.GFX_TARGETS }}
            **ROCm (TheRock wheels):** ${{ env.ROCM_VERSION }}
            **Commit:** ${{ github.sha }}
            **Release Tag:** ${{ env.RELEASE_TAG }}

            ### Como usar
            1. Baixe o ZIP
            2. Extraia em uma pasta
            3. Execute `llama-server.exe` ou `llama-cli.exe`

            **IMPORTANTE:** NÃO defina `GGML_HIP_ENABLE_UNIFIED_MEMORY=1`
          files: llama-windows-*.zip
          draft: false
          prerelease: false

      - name: ccache-clear
        if: always()
        uses: ./.github/actions/ccache-clear
        with:
          key: llama-windows-hip-${{ env.ROCM_VERSION }}-${{ env.GFX_TARGETS }}

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      ROCM_LINUX_VERSION: '7.2.1'

    steps:
      - name: Checkout fork
        uses: actions/checkout@v6

      - name: Clone upstream
        shell: bash
        run: |
          set -e
          git clone --depth 1 --branch perf ${{ env.UPSTREAM_REPO }} upstream-temp
          cd "$GITHUB_WORKSPACE"
          shopt -s dotglob
          for item in upstream-temp/*; do
              name="$(basename "$item")"
              if [ "$name" = ".git" ]; then
                  continue
              fi
              rm -rf "$GITHUB_WORKSPACE/$name"
              cp -r "$item" "$GITHUB_WORKSPACE/$name"
          done
          rm -rf upstream-temp

      - name: Free up disk space
        uses: ggml-org/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - name: Setup ROCm (apt)
        shell: bash
        run: |
          sudo apt-get update
          sudo mkdir -p /etc/apt/keyrings
          wget -qO - https://repo.radeon.com/rocm/rocm.gpg.key \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null <<EOF
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${{ env.ROCM_LINUX_VERSION }} jammy main
          EOF
          sudo tee /etc/apt/preferences.d/rocm-pin-600 >/dev/null <<EOF
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
          EOF
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential cmake git wget libssl-dev rocm-hip-sdk

      - name: Verify ROCm
        shell: bash
        run: |
          hipconfig --version
          hipconfig -l

      - name: Configure and Build
        shell: bash
        run: |
          cmake -B build -S . \
            -DCMAKE_HIP_COMPILER="$(hipconfig -l)/clang" \
            -DCMAKE_BUILD_TYPE=Release \
            -DGGML_HIP=ON \
            -DGGML_HIP_FORCE_MMQ=ON \
            -DHIP_PLATFORM=amd \
            -DGGML_VULKAN=OFF \
            -DGGML_CUDA=OFF \
            -DGPU_TARGETS="${{ env.GFX_TARGETS }}" \
            -DLLAMA_BUILD_SERVER=ON \
            -DLLAMA_BUILD_UI=OFF \
            -DLLAMA_BUILD_TESTS=OFF
          cmake --build build -j $(nproc)
          echo "Build completed successfully."

      - name: Create release archive
        shell: bash
        run: |
          archive="llama-linux-x64-rocm${{ env.ROCM_LINUX_VERSION }}-${{ env.GFX_TARGETS }}.tar.gz"
          archive="${archive//;/_}"
          cp LICENSE build/bin/ 2>/dev/null || true
          tar -czvf "$archive" -C build/bin .
          echo "Archive: $archive"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: llama-Linux-${{ env.ROCM_LINUX_VERSION }}-${{ env.GFX_TARGETS }}
          path: llama-linux-*.tar.gz
          retention-days: 90

      - name: Attach Linux build to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: llama-linux-*.tar.gz
          preserve_order: true
          draft: false
          prerelease: false
